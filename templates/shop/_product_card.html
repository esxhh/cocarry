<article class="product-card"><a class="product-image" href="{% url 'product_detail' product.slug %}"><img src="{{ product.cover_image }}" alt="{{ product.name }}"><span class="badge">{{ product.discount_percent }}% OFF</span><span class="quick-label">VIEW DETAILS ↗</span></a><div class="product-meta"><div><a class="product-name" href="{% url 'product_detail' product.slug %}">{{ product.name }}</a><div class="rating">★ {{ product.rating }} <small>· COCARRY fave</small></div></div><div class="prices"><strong>₹{{ product.discounted_price|floatformat:0 }}</strong><del>₹{{ product.price|floatformat:0 }}</del></div></div><form method="post" action="{% url 'add_to_cart' product.id %}">{% csrf_token %}<input type="hidden" name="next" value="{% url 'shop' %}"><button class="add-button" {% if not product.stock %}disabled{% endif %}>ADD TO BAG +</button></form></article>
